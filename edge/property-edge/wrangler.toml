# Arriv Property Visibility — edge serving layer.
#
# ── WORKER IDENTITY (verified 2026-11-10 from the live endpoints) ────────────────────────────────
#   PRODUCTION Worker name:  arriv-property-staging        ← legacy name, DO NOT RENAME
#     * It is the Worker the custom domain properties.arrivestatemedia.com is attached to.
#     * Its workers.dev alias arriv-property-staging.<account-subdomain>.workers.dev serves the
#       SAME deployment (identical /__health), which is the URL the app's PROPERTY_EDGE_PURGE_URL
#       currently uses — so the app's purges DO reach production today.
#     * It holds the live PURGE_SECRET and the custom-domain binding.
#     Renaming it is not possible in place: Cloudflare has no rename, so a rename means creating a
#     second Worker and moving the domain onto it, which duplicates production and can conflict with
#     the existing route. The name stays. `name` below must therefore stay "arriv-property-staging".
#
#   STAGING Worker name:     arriv-property-edge-staging   ← separate Worker, workers.dev only
#     * No route and no custom domain, so nothing is public under the Arriv domain.
#     * It has never been deployed; the first `wrangler deploy --env staging` creates it.
#     * Secrets are per Worker and are NOT copied: it needs its own PURGE_SECRET.
#
#   Deployment commands (from this directory):
#     npx wrangler@latest deploy               → production, arriv-property-staging
#     npx wrangler@latest deploy --env staging → staging, arriv-property-edge-staging
#
#   SAFETY: deploying with any other `name` creates a NEW Worker that serves nothing, while
#   properties.arrivestatemedia.com keeps answering from the old one. Never change `name` to
#   "arriv-property-edge" (an earlier, never-created name in this file) or to any new value.
# ────────────────────────────────────────────────────────────────────────────────────────────────

name = "arriv-property-staging"
main = "worker.mjs"
compatibility_date = "2026-10-01"

# Must stay enabled while the app's PROPERTY_EDGE_PURGE_URL points at the workers.dev alias.
# If it is ever turned off, switch that app secret to https://properties.arrivestatemedia.com/__purge
# first, or purges stop reaching the edge.
workers_dev = true

[vars]
# The app host the worker proxies to (no trailing slash). This is the ONLY origin dependency, so
# pointing it elsewhere is all that a future migration away from Base44 requires.
#
# IMPORTANT: this value must name the host the APP EMITS property URLs on, not merely a host that
# serves the app, because normaliseHosts() rewrites exactly that host to PUBLIC_HOST. With
# PROPERTY_PUBLIC_ORIGIN set on the app (the production configuration) the origin already emits
# property-domain URLs and this rewrite is a no-op safety net either way.
# VERIFIED 2026-11-10 on the branded host: /properties → the app SPA, /functions/
# generatePropertySitemap → the app's XML, /functions/getPublicPropertyPage → the app's JSON,
# /functions/getPublicVisibilityPage → the app's HTML. The custom domain is the correct ORIGIN_BASE:
# it is the app's own branded origin, so the proxy keeps working if the *.base44.app alias changes.
# If the branded host is ever unavailable, deleting this var falls back to the platform host
# (DEFAULT_ORIGIN in worker.mjs) — one line, no code change.
ORIGIN_BASE = "https://app.arrivestatemedia.com"
# The public host these pages are canonical on. On staging use the workers.dev hostname.
PUBLIC_HOST = "properties.arrivestatemedia.com"
# Hard kill switch. "true" makes every public path return 503 with no cache read, so nothing
# stored at the edge can be served. The signed purge endpoint stays reachable while dark.
PROPERTY_EDGE_DISABLED = "false"
# Cache lifetimes, in seconds. Media and HTML are deliberately capped at 300 so a lost purge is
# bounded to five minutes (the origin offers 24h for media; the edge overrides it).
HTML_TTL_SECONDS = "300"
MEDIA_TTL_SECONDS = "300"
SITEMAP_TTL_SECONDS = "900"
NOT_FOUND_TTL_SECONDS = "60"

# Secrets (set with `wrangler secret put`, never committed). Secrets belong to one Worker by name and
# survive a deploy of that same name; a deploy never touches them.
#   Production: wrangler secret put PURGE_SECRET
#               — must equal the app's PROPERTY_EDGE_PURGE_SECRET (already set, already matching)
#   Staging:    wrangler secret put PURGE_SECRET --env staging   (after the first staging deploy)

# ── PRODUCTION BINDING — DO NOT UNCOMMENT ───────────────────────────────────────────────────────
# The custom domain properties.arrivestatemedia.com is attached to arriv-property-staging in the
# Cloudflare dashboard (Workers → arriv-property-staging → Settings → Domains & Routes). A deploy of
# that same Worker name preserves it. Adding a route or custom_domain entry here would attempt to
# claim the hostname a second time and can conflict with the existing binding, so these stay
# commented. If the nameservers ever move to Cloudflare *and* the dashboard binding is removed, only
# then would a route be the right mechanism:
# [[routes]]
# pattern = "properties.arrivestatemedia.com/*"
# zone_name = "arrivestatemedia.com"

# Staging: separate Worker, no route and no custom domain, so nothing is public under the Arriv
# domain. Never add [[routes]], [[custom_domain]] or a production alias here.
[env.staging]
name = "arriv-property-edge-staging"
workers_dev = true

[env.staging.vars]
ORIGIN_BASE = "https://app.arrivestatemedia.com"
# Replace with the hostname wrangler prints after the first staging deploy.
PUBLIC_HOST = "arriv-property-edge-staging.workers.dev"
PROPERTY_EDGE_DISABLED = "false"
HTML_TTL_SECONDS = "300"
MEDIA_TTL_SECONDS = "300"
SITEMAP_TTL_SECONDS = "900"
NOT_FOUND_TTL_SECONDS = "60"