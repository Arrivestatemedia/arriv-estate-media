# Arriv Property Visibility — edge serving layer.
#
# DEPLOYED AND LIVE — verified 2026-10-12 against the running endpoint itself, not inferred from
# this file:
#   * https://properties.arrivestatemedia.com answers from Cloudflare's edge: /__health 200,
#     /robots.txt 200 with the property host in its Sitemap line, unknown paths 404 at the edge,
#     and POST /__purge enforcing its HMAC signature (unsigned, stale and wrong-secret all 401).
#   * The deployed worker reports PUBLIC_HOST and ORIGIN_BASE both unset, so both fall back to the
#     Base44 app host. That makes the host rewrite below a no-op (originHost === publicHost) and
#     namespaces its cache keys on the app host. It is NOT harmful once PROPERTY_PUBLIC_ORIGIN is
#     set on the app (done), because the origin then emits property-domain URLs itself — but
#     PUBLIC_HOST should still be set to the property host on the next deploy so the safety net is
#     real and the cache keys are namespaced where a purge looks for them.
#   * Changing the deployed vars or secret needs Cloudflare credentials (`wrangler deploy`,
#     `wrangler secret put`), which this workspace does not hold. This file is the source of truth
#     for the intended configuration; the deployed values must be reconciled by the operator.

name = "arriv-property-edge"
main = "worker.mjs"
compatibility_date = "2026-10-01"

[vars]
# The app host the worker proxies to (no trailing slash). This is the ONLY origin dependency, so
# pointing it elsewhere is all that a future migration away from Base44 requires.
#
# IMPORTANT: this value must name the host the APP EMITS property URLs on, not merely a host that
# serves the app, because normaliseHosts() rewrites exactly that host to PUBLIC_HOST. With
# PROPERTY_PUBLIC_ORIGIN set on the app (the production configuration) the origin already emits
# property-domain URLs and this rewrite is a no-op safety net either way.
ORIGIN_BASE = "https://app.arrivestatemedia.com"
# The public host these pages are canonical on. On staging use the workers.dev hostname.
PUBLIC_HOST = "properties.arrivestatemedia.com"
# Hard kill switch. "true" makes every public path return 503 with no cache read, so nothing
# stored at the edge can be served. The signed purge endpoint stays reachable while dark.
PROPERTY_EDGE_DISABLED = "false"
# Cache lifetimes, in seconds. Media and HTML are deliberately capped at 300 so a lost purge is
# bounded to five minutes (the origin offers 24h for media; the edge overrides it).
HTML_TTL_SECONDS = "300"
MEDIA_TTL_SECONDS = "300"
SITEMAP_TTL_SECONDS = "900"
NOT_FOUND_TTL_SECONDS = "60"

# Secrets (set with `wrangler secret put`, never committed):
#   PURGE_SECRET  — must equal the app's PROPERTY_EDGE_PURGE_SECRET.
#   wrangler secret put PURGE_SECRET --env staging

# Staging: no route and no custom domain, so nothing is public under the Arriv domain.
[env.staging]
name = "arriv-property-edge-staging"
workers_dev = true

[env.staging.vars]
ORIGIN_BASE = "https://app.arrivestatemedia.com"
# Replace with the hostname wrangler prints after the first staging deploy.
PUBLIC_HOST = "arriv-property-edge-staging.workers.dev"
PROPERTY_EDGE_DISABLED = "false"
HTML_TTL_SECONDS = "300"
MEDIA_TTL_SECONDS = "300"
SITEMAP_TTL_SECONDS = "900"
NOT_FOUND_TTL_SECONDS = "60"

# Production binding — deliberately commented out until the DNS decision in the header is made.
# Option (a), only if the nameservers move to Cloudflare:
# [[routes]]
# pattern = "properties.arrivestatemedia.com/*"
# zone_name = "arrivestatemedia.com"